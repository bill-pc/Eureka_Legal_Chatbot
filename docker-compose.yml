# Local stack: only api and web are built from source; the rest are stock images.
services:
  api:
    build: ./apps/api
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [qdrant, neo4j, redis, postgres]
  web:
    build: ./apps/web
    ports: ["5173:5173"]
  qdrant:
    image: qdrant/qdrant
    ports: ["6333:6333"]
  neo4j:
    image: neo4j:5
    ports: ["7474:7474", "7687:7687"]
  redis:
    image: redis:7
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
